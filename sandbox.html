<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Номера города: песочница</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500;600;700&display=swap">
<style>
/* Полноэкранная игра; HUD в духе San Andreas: полосы и деньги справа сверху, радар слева снизу. Одна тёмная «игровая» тема. */
:root{--bg:#0d1118;--panel:rgba(14,19,30,.9);--line:rgba(255,255,255,.14);--fg:#f2f4f8;--mut:#9aa4b6;--go:#38e07b;--gold:#ffd23f;--red:#e5484d;--blue:#3d7bff;
  --sa-hp:#b4191d;--sa-arm:#e1e1e1;--sa-armf:#5b8fd8;--sa-money:#2f7d31;--hud:'Teko','Arial Narrow','Roboto Condensed',sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0}
#app canvas.gl{display:block;width:100%;height:100%;touch-action:none}
#app,#app *{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.hud{position:absolute;z-index:5;pointer-events:none}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.out{text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,1.5px 1.5px #000,-1.5px -1.5px #000,1.5px -1.5px #000,-1.5px 1.5px #000}
/* --- SA: оружие, полосы, деньги --- */
#sa{top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
#weap{pointer-events:auto;cursor:pointer;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5d6a7a,#1d232c 70%);border:3px solid #000;display:grid;place-items:center;position:relative}
#wname{position:absolute;top:66px;right:0;font:600 16px/1 var(--hud);color:#fff;white-space:nowrap}
#ammo{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:600 19px/1 var(--hud);color:#d7dde6;white-space:nowrap}
.bars{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
#clock{font:600 26px/1 var(--hud);color:#fff;letter-spacing:.02em}
.bar{width:132px;height:12px;background:#000;border:2px solid #000;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
#hpb{background:#4a0b0d}#hpb i{background:linear-gradient(#e33238,var(--sa-hp))}
#arb{background:#1c2b44}#arb i{background:linear-gradient(#e9eef6,#9aa9bf)}
#cash{font:400 32px/1 'Anton',var(--hud);color:#3fae45;letter-spacing:.03em;font-variant-numeric:tabular-nums;margin-top:1px}
#stars{font:400 24px/1 'Anton',sans-serif;letter-spacing:1px;color:#2a2a2a;margin-top:2px}#stars b{color:#f2c31b}#stars.blink b{animation:st .5s steps(2) infinite}@keyframes st{50%{color:#fff}}
.fl{position:absolute;z-index:6;pointer-events:none;font:400 26px/1 'Anton',sans-serif;color:#3fae45;animation:fl 1.1s ease-out forwards;white-space:nowrap}.fl.hp{color:#ff4d4d}@keyframes fl{to{transform:translate(-50%,-70px);opacity:0}}
#mtimer{font:700 30px/1 var(--hud);color:#fff;margin-top:4px}
/* --- радар --- */
#radar{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:var(--rd,150px);height:var(--rd,150px);border-radius:50%;border:4px solid #000;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.5);overflow:hidden}
#radar canvas{width:100%;height:100%;display:block}
/* --- тексты миссий в стиле SA --- */
#obj{left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:600 25px/1.1 var(--hud);color:#fff;text-align:center;width:min(640px,calc(100vw - 32px))}
#obj b{color:#ffd23f;font-weight:700}
#big{left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;font:700 clamp(40px,8vw,74px)/1 var(--hud);letter-spacing:.04em;white-space:nowrap}
#big.pass{color:#e8b923}#big.fail{color:#c9252b}#big.wasted{color:#b0161b;font-size:clamp(54px,11vw,96px)}
#big small{display:block;font-size:.45em;color:#fff;letter-spacing:.02em}
#hint{left:50%;top:calc(24% + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;font-size:16px;font-weight:600;white-space:nowrap}
#hint kbd,#tag kbd{font:700 13px ui-monospace,monospace;background:var(--gold);color:#1b1500;border-radius:6px;padding:1px 7px}
#spd{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:5px 13px;font:600 24px/1 var(--hud);font-variant-numeric:tabular-nums}
#spd small{color:var(--mut);font-size:15px;margin-left:3px}
#cross{left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross::before{left:12px;top:0;width:2px;height:26px}#cross::after{top:12px;left:0;height:2px;width:26px}
#cross.hit::before,#cross.hit::after{background:#ff3b3b}
#toast{left:50%;top:calc(14% + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 16px;font-weight:600;transition:opacity .25s;white-space:nowrap}
#dmg{inset:0;background:radial-gradient(circle,transparent 55%,rgba(200,0,0,.5));opacity:0;transition:opacity .3s}
/* --- шапка: шестерёнка + подсказка --- */
#gear{position:absolute;z-index:40;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(10,14,22,.7);font-size:22px;cursor:pointer;color:#fff}
#gear[aria-pressed="true"]{background:var(--gold);color:#1b1500;border-color:#fff}
#tag{top:calc(10px + env(safe-area-inset-top,0px));left:calc(68px + env(safe-area-inset-left,0px));padding:7px 11px;max-width:min(360px,40vw);font-size:12px;color:var(--mut)}
#tag b{color:var(--fg);font-size:13px;display:block}
@media (max-width:640px){#tag{display:none}}
/* --- экранные кнопки (перетаскиваемые) --- */
.cb{position:absolute;z-index:30;width:var(--bs,68px);height:var(--bs,68px);border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;
  font:700 22px/1 system-ui;text-shadow:0 1px 3px #000;touch-action:none;cursor:pointer;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:transform .06s,background .1s}
.cb small{position:absolute;bottom:7px;font:600 10px/1 system-ui;opacity:.75}
.cb.on{background:rgba(255,255,255,.42);transform:scale(.93)}
.cb.fire{background:rgba(229,72,77,.45)}.cb.fire.on{background:rgba(229,72,77,.75)}
.cb.dim{opacity:.4}
#app.edit .cb{outline:3px dashed var(--gold);outline-offset:3px;animation:wob 1.2s ease-in-out infinite;cursor:grab}
#app.edit .cb.drag{cursor:grabbing;animation:none;background:rgba(255,210,63,.45)}
@keyframes wob{50%{transform:scale(1.06)}}
#editbar{position:absolute;z-index:45;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:9px 12px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
#editbar b{font-size:14px}
#editbar button{border:0;border-radius:10px;padding:8px 12px;font:600 13px system-ui;cursor:pointer;background:#2a303c;color:var(--fg)}
#editbar button.p{background:var(--gold);color:#1b1500}
#editbar .sz{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
#editbar .sz button{min-width:36px;font-size:16px;padding:6px 8px}
/* --- меню магазина --- */
#shop{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,8,14,.45);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#shop .box{width:min(430px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;border-top:4px solid var(--acc,var(--blue))}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.sh .ic{font-size:30px;line-height:1}.sh h2{margin:0;font-size:20px}.sh p{margin:2px 0 0;color:var(--mut);font-size:12px}.sh button{margin-left:auto}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:rgba(255,255,255,.03)}
.it .e{font-size:24px;width:30px;text-align:center}.it .t{flex:1;min-width:0}.it .t b{display:block;font-size:15px}.it .t span{color:var(--mut);font-size:12px}
.buy{border:0;border-radius:10px;padding:9px 12px;background:var(--go);color:#062312;font:700 14px system-ui;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy:disabled{background:#3a404c;color:#8b93a3;cursor:not-allowed}.buy.own{background:transparent;border:1px solid var(--go);color:var(--go)}
.x{border:0;background:#2a303c;color:var(--fg);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mut);font-size:12px}
.foot kbd{font:600 11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#app.edit .cb{animation:none}.bar i,#toast,#dmg{transition:none}}
</style>

<div id="app">
  <button id="gear" aria-pressed="false" aria-label="Настроить кнопки">⚙️</button>
  <div class="hud pnl" id="tag"><b>Песочница: превью</b>WASD — ехать/идти · F — сесть/угнать · ЛКМ/Пробел — огонь · 1–9/колесо — оружие · Shift — прыжок · E — магазин/миссия</div>
  <div class="hud" id="sa">
    <div id="weap" role="button" aria-label="Сменить оружие"><canvas id="wic" width="88" height="88" style="width:44px;height:44px"></canvas><div id="ammo" class="out">17-∞</div></div>
    <div class="bars"><div id="clock" class="out">14:00</div><div class="bar" id="hpb"><i id="hpf"></i></div><div class="bar" id="arb"><i id="arf"></i></div><div id="cash" class="out">₽00050000</div><div id="stars" class="out" aria-label="Розыск"></div><div id="mtimer" class="out" hidden>2:00</div></div>
  </div>
  <div class="hud" id="radar"><canvas id="rdc" width="300" height="300"></canvas></div>
  <div class="hud out" id="obj" hidden></div>
  <div class="hud out" id="big" hidden></div>
  <div class="hud pnl" id="hint" hidden></div>
  <div class="hud pnl" id="spd"><span id="sval">0</span><small>км/ч</small></div>
  <div class="hud" id="cross" hidden></div>
  <div class="hud pnl" id="toast" hidden></div>
  <div class="hud" id="dmg"></div>
  <div class="pnl" id="editbar" hidden><b>Режим настройки — игра на паузе. Тяни кнопки.</b><span class="sz">Размер <button id="szm" aria-label="Меньше">−</button><button id="szp" aria-label="Больше">+</button></span><button id="ereset">Сбросить</button><button class="p" id="edone">Готово</button></div>
  <div id="shop" hidden><div class="box pnl" role="dialog" aria-modal="true" aria-labelledby="stitle">
    <div class="sh"><div class="ic" id="sic"></div><div><h2 id="stitle"></h2><p id="ssub"></p></div><button class="x" id="sclose" aria-label="Закрыть">✕</button></div>
    <div id="items"></div>
    <div class="foot"><span>Игра стоит, пока открыт магазин</span><span><kbd>Esc</kbd> — выйти</span></div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,app=document.getElementById('app'),OCC=[];
const MOB=matchMedia('(pointer:coarse)').matches;let PR=Math.min(devicePixelRatio||1,MOB?1.25:1.5);
const R=new T.WebGLRenderer({antialias:!MOB,powerPreference:'high-performance'});R.setPixelRatio(PR);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFShadowMap;R.shadowMap.autoUpdate=false;
R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.physicallyCorrectLights=false;app.prepend(R.domElement);
const sc=new T.Scene();const SKY=0xe7a77a;sc.fog=new T.Fog(SKY,70,215);
const cam=new T.PerspectiveCamera(60,1,.5,300);
let sky;const ANI=Math.min(4,R.capabilities.getMaxAnisotropy());
/* небо-градиент + отражения окружения (PMREM) — без него металл и стекло выглядят «пластиком» */
{const g=new T.SphereGeometry(240,32,16),col=[],p=g.attributes.position,c=new T.Color(),top=new T.Color(0x2c4a86),hor=new T.Color(0xffb27a),gnd=new T.Color(0x5a4a42),mid=new T.Color(0xe06a4a);

  g.setAttribute('color',new T.Float32BufferAttribute(col,3));sky=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false,depthWrite:false}));sky.renderOrder=-1;sc.add(sky);{const sd=new T.Vector3(120,40,75).normalize().multiplyScalar(225),disc=new T.Mesh(new T.SphereGeometry(9,20,12),new T.MeshBasicMaterial({color:0xffd9a0,fog:false,toneMapped:false}));disc.position.copy(sd);sky.add(disc);const halo=new T.Mesh(new T.SphereGeometry(20,20,12),new T.MeshBasicMaterial({color:0xffa060,transparent:true,opacity:.35,fog:false,toneMapped:false,depthWrite:false}));halo.position.copy(sd);sky.add(halo)}
  const es=new T.Scene();es.add(sky.clone());const sb=new T.Mesh(new T.SphereGeometry(30,16,8),new T.MeshBasicMaterial({color:0xffb070}));sb.position.set(240,80,150);es.add(sb);
  const pm=new T.PMREMGenerator(R);sc.environment=pm.fromScene(es,.02).texture;pm.dispose()}
sc.add(new T.HemisphereLight(0xffd6b0,0x4a3a40,.42));
const sun=new T.DirectionalLight(0xffb070,2.6);sun.position.set(60,90,40);sun.castShadow=true;sun.shadow.mapSize.set(MOB?1024:2048,MOB?1024:2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,far:220});sc.add(sun);sc.add(sun.target);

/* ---------- PBR-текстуры на Canvas: цвет + высота → карта нормалей (Собель) + шероховатость ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}
// три слоя рисуются одновременно: C — цвет, H — высота (светлее = выше), Rg — шероховатость (светлее = матовее)
function layers(n){const[c,C]=cv(n,n),[h,H]=cv(n,n),[r,Rg]=cv(n,n);return{n,c,h,r,C,H,Rg,all(f){f(C,'c');f(H,'h');f(Rg,'r')}}}
function normalFrom(hc,str){const n=hc.width,src=hc.getContext('2d').getImageData(0,0,n,n).data,[o,x]=cv(n,n),img=x.createImageData(n,n),d=img.data,H=i=>src[i*4]/255;
  for(let y=0;y<n;y++)for(let X=0;X<n;X++){const l=H(y*n+(X-1+n)%n),r=H(y*n+(X+1)%n),u=H(((y-1+n)%n)*n+X),dn=H(((y+1)%n)*n+X);
    let nx=(l-r)*str,ny=(u-dn)*str,nz=1;const k=1/Math.hypot(nx,ny,nz);const i=(y*n+X)*4;d[i]=(nx*k*.5+.5)*255;d[i+1]=(ny*k*.5+.5)*255;d[i+2]=(nz*k*.5+.5)*255;d[i+3]=255}
  x.putImageData(img,0,0);return o}
function pbr(L,str,rep){const tx=(cnv,srgb)=>{const t=new T.CanvasTexture(cnv);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=ANI;if(srgb)t.encoding=T.sRGBEncoding;if(rep)t.repeat.set(rep[0],rep[1]);return t};
  return{map:tx(L.c,1),normalMap:tx(normalFrom(L.h,str)),roughnessMap:tx(L.r)}}
const gry=v=>`rgb(${v|0},${v|0},${v|0})`;
// асфальт: щебень, пятна масла, заплатки, трещины-впадины
function asphaltBase(L){const{n,C,H,Rg}=L;C.fillStyle='#26282b';C.fillRect(0,0,n,n);H.fillStyle=gry(128);H.fillRect(0,0,n,n);Rg.fillStyle=gry(225);Rg.fillRect(0,0,n,n);
  for(let i=0;i<5;i++){const x=Math.random()*n,y=Math.random()*n,w=rnd(60,180),h=rnd(40,120);C.fillStyle=`rgba(${rnd(30,48)|0},${rnd(31,49)|0},${rnd(33,51)|0},.55)`;C.fillRect(x,y,w,h);Rg.fillStyle=gry(205);Rg.fillRect(x,y,w,h)}
  for(let i=0;i<n*n/9;i++){const x=Math.random()*n,y=Math.random()*n,s=rnd(1,3.2),g=rnd(22,95);C.fillStyle=`rgb(${g|0},${g|0},${g+3|0})`;C.fillRect(x,y,s,s);H.fillStyle=gry(128+rnd(10,70));H.fillRect(x,y,s,s);Rg.fillStyle=gry(rnd(170,250));Rg.fillRect(x,y,s,s)}
  for(let i=0;i<4;i++){const x=Math.random()*n,y=Math.random()*n,r=rnd(15,45);const gr=C.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(8,8,10,.55)');gr.addColorStop(1,'rgba(8,8,10,0)');C.fillStyle=gr;C.fillRect(x-r,y-r,r*2,r*2);const g2=Rg.createRadialGradient(x,y,0,x,y,r);g2.addColorStop(0,gry(90));g2.addColorStop(1,'rgba(0,0,0,0)');Rg.fillStyle=g2;Rg.fillRect(x-r,y-r,r*2,r*2)}
  for(let i=0;i<10;i++){let x=Math.random()*n,y=Math.random()*n;const pts=[[x,y]];for(let k=0;k<9;k++){x+=rnd(-38,38);y+=rnd(-38,38);pts.push([x,y])}
    L.all((ctx,k)=>{ctx.strokeStyle=k==='c'?'#0b0b0c':k==='h'?gry(40):gry(150);ctx.lineWidth=k==='h'?3.2:1.6;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()})}}

function paint(L,x,y,w,h,col){const{C,H,Rg}=L;C.fillStyle=col;C.fillRect(x,y,w,h);H.fillStyle=gry(150);H.fillRect(x,y,w,h);Rg.fillStyle=gry(120);Rg.fillRect(x,y,w,h);
  for(let i=0;i<w*h/14;i++){const ex=x+Math.random()*w,ey=y+Math.random()*h,s=rnd(1,4);C.fillStyle=`rgba(40,41,44,${rnd(.4,.9)})`;C.fillRect(ex,ey,s,s);H.fillStyle=gry(130);H.fillRect(ex,ey,s,s);Rg.fillStyle=gry(215);Rg.fillRect(ex,ey,s,s)}}
function roadMaps(){const L=layers(1024);asphaltBase(L);for(let y=0;y<1024;y+=128){paint(L,486,y+8,20,72,'#d9b02e');paint(L,518,y+8,20,72,'#d9b02e')}paint(L,26,0,16,1024,'#e7e6e0');paint(L,982,0,16,1024,'#e7e6e0');return pbr(L,5,[1,(EXT*2)/RW/1.4])}

  if(Math.hypot(c.x-px(),c.z-pz())<r&&!ST.dead){if(c.kind==='cash'){ST.money+=c.v;floatText('+'+c.v+' ₽',c.x,1.6,c.z);sfx(1200,.12,'triangle',.05)}else{ST.hp=Math.min(100,ST.hp+25);floatText('+25 ❤',c.x,1.6,c.z,'hp');sfx(900,.15,'sine',.06)}sc.remove(c.g);LOOT.splice(i,1)}
  else if(c.t>60){sc.remove(c.g);LOOT.splice(i,1)}}}

/* ---------- розыск ---------- */
function crime(v){const before=ST.wanted;ST.wanted=clamp(Math.max(ST.wanted,v),0,5);if(before&&v>=1&&ST.crimeT>3)ST.wanted=clamp(ST.wanted+1,0,5);ST.crimeT=0;ST.lostT=0;if(ST.wanted>before)sfx(700,.25,'square',.04);reinforce()}
function reinforce(){const want=Math.min(6,1+ST.wanted);let alive=COPS.filter(c=>c.state!=='dead'&&!c.gone).length;while(alive<want){const n=mkNpc('cop');laneSpawn(n,true);COPS.push(n);alive++}}
function stepWanted(dt){if(!ST.wanted)return;ST.crimeT+=dt;let nearest=1e9;for(const c of COPS)if(c.state!=='dead'&&!c.gone)nearest=Math.min(nearest,Math.hypot(c.x-px(),c.z-pz()));
  if(ST.crimeT>12&&nearest>70){ST.lostT+=dt;if(ST.lostT>7){ST.wanted--;ST.lostT=0;toast(ST.wanted?'Розыск снижается':'Розыск снят')}}else ST.lostT=0}

/* ---------- урон по NPC ---------- */
function angerGang(g){for(const k of (ALLY_ANGER[g]||[g]))for(const n of NPC)if(n.kind==='gang'&&n.gang===k&&n.state!=='dead')n.angry=1}
function damageNpc(n,dmg,dx,dz,byCar){if(n.state==='dead'||n.gone)return;n.hp-=dmg;
  if(n.kind==='civ'){if(n.hp>0){n.run=7;n.dir*=-1}crime(1)}
  else if(n.kind==='cop')crime(2);
  else if(n.kind==='gang'){angerGang(n.gang);if(COPS.some(c=>c.state!=='dead'&&!c.gone&&Math.hypot(c.x-n.x,c.z-n.z)<45))crime(1)}
  else n.hit=1;
  if(n.hp<=0)killNpc(n,dx,dz,byCar)}
function killNpc(n,dx,dz,byCar){n.state='dead';n.t=0;n.fallH=Math.atan2(-dx,-dz);n.slide=byCar?8:1.5;n.fx=dx;n.fz=dz;n.m.hb.visible=false;sfx(160,.25,'square',.05);
  drop(n.x+rnd(-.4,.4),n.z+rnd(-.4,.4),'cash',n.kind==='civ'?rnd(20,120):rnd(80,350));if(Math.random()<(n.kind==='civ'?.3:.55))drop(n.x+rnd(-1,1),n.z+rnd(-1,1),'kit');
  if(n.kind==='bandit'&&MS&&MS.kind==='kill'){MS.left--;missionText()}
  for(const o of NPC)if(o.kind==='civ'&&o.state==='walk'&&Math.hypot(o.x-n.x,o.z-n.z)<30)o.run=6}

/* ---------- поведение NPC ---------- */
function hostile(n,dt,agg){const tx=px(),tz=pz(),dx=tx-n.x,dz=tz-n.z,d=Math.hypot(dx,dz),g=n.m.g;n.cd-=dt;g.rotation.set(0,Math.atan2(dx,dz),0);
  if(d>(n.kind==='cop'?7:9)){const v=n.kind==='cop'?4.2:3.6,nx=n.x+dx/d*v*dt,nz=n.z+dz/d*v*dt;if(!hit(nx,n.z,.35))n.x=nx;if(!hit(n.x,nz,.35))n.z=nz;n.ph+=dt*11;animPerson(n.m,n.ph,.9,0)}
  else animPerson(n.m,0,0,1,n.m.two);
  if(d<agg&&n.cd<=0&&!ST.dead){n.cd=rnd(1.0,1.7);const a=new T.Vector3();n.m.mz.getWorldPosition(a);const miss=Math.random()<(ST.mode==='car'?.6:.45)+d/100,b=new T.Vector3(tx+(miss?rnd(-2,2):0),1.2,tz+(miss?rnd(-2,2):0));
    tracer(a,b,n.kind==='cop'?0x8fb6ff:0xff8a3a);sfx(1400,.1,'',.05,true);if(!miss)hurt(ST.mode==='car'?3:n.kind==='cop'?6:7)}}
function walkLane(n,dt){const v=n.run>0?4.6:n.sp;if(n.run>0)n.run-=dt;n.u+=n.dir*v*dt;if(Math.abs(n.u)>150){n.dir*=-1;n.u=clamp(n.u,-150,150)}if(Math.abs(n.u)<RW/2+2.2){n.dir=Math.sign(n.u)||1;n.u=(RW/2+2.3)*n.dir}
  const[x,z]=lanePos(n),hx=n.lane.ax==='x'?n.dir:0,hz=n.lane.ax==='z'?n.dir:0;n.x+=(x-n.x)*Math.min(1,dt*4);n.z+=(z-n.z)*Math.min(1,dt*4);n.m.g.rotation.set(0,Math.atan2(hx,hz),0);n.ph+=dt*(n.run>0?11:6.2);animPerson(n.m,n.ph,n.run>0?.95:.42)}
function goTo(n,x,z,dt){const dx=x-n.x,dz=z-n.z,d=Math.hypot(dx,dz);if(d<.3)return true;const v=1.6;n.x+=dx/d*v*dt;n.z+=dz/d*v*dt;n.m.g.rotation.set(0,Math.atan2(dx,dz),0);n.ph+=dt*6.5;animPerson(n.m,n.ph,.45);return false}
function stepNpc(n,dt){n.t+=dt;const g=n.m.g;
  if(n.state==='dead'){const k=Math.min(1,n.t/.6);g.rotation.set(0,0,0);g.rotateY(n.fallH);g.rotateX(-k*Math.PI/2);if(n.slide>.05){n.x+=n.fx*n.slide*dt;n.z+=n.fz*n.slide*dt;n.slide*=Math.exp(-dt*4)}
    g.position.set(n.x,.22+.12*k,n.z);animPerson(n.m,0,0);
    if(n.t>25){if(n.kind==='civ')laneSpawn(n,true);else if(n.kind==='gang'){n.state='idle';n.hp=90;n.angry=0;n.x=n.home[0];n.z=n.home[1];g.rotation.set(0,0,0)}else if(n.kind==='cop'&&COPS.filter(c=>c.state!=='dead'&&!c.gone).length<2)laneSpawn(n,true);else{g.visible=false;n.gone=1}}return}
  n.m.hb.visible=true;
  if(ST.mode==='car'&&Math.abs(P.v)>5&&Math.hypot(n.x-P.x,n.z-P.z)<1.8){damageNpc(n,999,Math.sin(P.h),Math.cos(P.h),true);return}
  if(n.kind==='civ'){if(ST.mode==='car'&&Math.abs(P.v)>6&&Math.hypot(n.x-P.x,n.z-P.z)<9&&n.run<=0)n.run=2.5;walkLane(n,dt)}
  else if(n.kind==='cop'){if(ST.wanted>0&&!ST.dead)hostile(n,dt,ST.wanted>=2?32:22);else{const[x,z]=lanePos(n);if(Math.hypot(x-n.x,z-n.z)>1.5)goTo(n,x,z,dt);else walkLane(n,dt)}}
  else if(n.kind==='gang'){if(n.angry&&!ST.dead){hostile(n,dt,30);if(Math.hypot(n.x-px(),n.z-pz())>90){n.calm=(n.calm||0)+dt;if(n.calm>10){n.angry=0;n.calm=0}}}
    else if(goTo(n,n.home[0],n.home[1],dt)){const G=GANGS[n.gang].at;g.rotation.set(0,Math.atan2(G[0]-n.x,G[1]-n.z),0);animPerson(n.m,0,0)}}
  else hostile(n,dt,30);
  g.position.set(n.x,.22,n.z)}

/* ---------- стрельба ---------- */
const RC=new T.Raycaster(),TR=[],trM=new T.LineBasicMaterial({color:0xffe14a,transparent:true}),flashM=new T.MeshBasicMaterial({color:0xffd27a,transparent:true});
function tracer(a,b,col){const g=new T.BufferGeometry().setFromPoints([a,b]),m=trM.clone();if(col)m.color.setHex(col);const l=new T.Line(g,m);sc.add(l);TR.push({o:l,t:0,life:.09});
  const f=new T.Mesh(new T.SphereGeometry(.1,6,4),flashM.clone());f.position.copy(a);sc.add(f);TR.push({o:f,t:0,life:.06})}
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5,UP=new T.Vector3(0,1,0);
function shoot(){if(ST.mode!=='foot'||ST.dead||paused||shop)return;const W=cw();if(ST.reload>0||ST.cd>0)return;if((ST.mags[W.id]??W.mag)<=0){ST.reload=W.modelType==='rpg'?2:1.3;sfx(400,.15,'square',.03);return}
  ST.mags[W.id]=(ST.mags[W.id]??W.mag)-1;ST.cd=W.fireRate/1000;F.aimT=1.2;F.h=camY;
  const snd={pistol:[1800,.12,.11],smg:[2200,.08,.08],shotgun:[900,.3,.16],rifle:[1500,.14,.12],sniper:[700,.45,.16],rpg:[300,.5,.14]}[W.modelType];sfx(snd[0],snd[1],'',snd[2],true);
  F.m.g.updateMatrixWorld(true);const a=new T.Vector3();F.m.mz.getWorldPosition(a);RC.setFromCamera({x:0,y:0},cam);const o=RC.ray.origin.clone(),base=RC.ray.direction.clone(),camD=cam.position.distanceTo(F.m.g.position)+.3;
  if(W.splash){const tgt=o.clone().addScaledVector(base,60);RC.far=200;const h=RC.intersectObjects(OCC,false).find(h=>h.distance>camD);if(h)tgt.copy(h.point);launchRocket(a,tgt.sub(a).normalize(),W);if(ST.mags[W.id]===0)ST.reload=2;return}
  const hbs=NPC.filter(n=>n.state!=='dead'&&!n.gone).map(n=>n.m.hb);let hitAny=false;
  for(let p=0;p<(W.pellets||1);p++){const dir=base.clone(),rt=new T.Vector3().crossVectors(dir,UP).normalize(),up=new T.Vector3().crossVectors(rt,dir);dir.addScaledVector(rt,gauss()*W.spread).addScaledVector(up,gauss()*W.spread).normalize();
    RC.set(o,dir);RC.far=W.range+camD;const hits=RC.intersectObjects(hbs.concat(OCC),false).filter(h=>h.distance>camD);let end=hits[0]?hits[0].point:o.clone().addScaledVector(dir,W.range+camD);
    const per=W.pellets?W.damage/3:W.damage;
    for(const h of hits){const n=h.object.userData.npc;if(!n){end=h.point;break}const head=h.point.y>1.58;damageNpc(n,per*(head?2:1),dir.x,dir.z);hitAny=true;if(!W.pierce){end=h.point;break}}
    if(p<3)tracer(a,end)}
  if(hitAny){$('cross').classList.add('hit');setTimeout(()=>$('cross').classList.remove('hit'),110)}
  for(const n of NPC)if(n.kind==='civ'&&n.state==='walk'&&Math.hypot(n.x-F.x,n.z-F.z)<28)n.run=Math.max(n.run,5);
  if(!ST.wanted&&COPS.some(c=>c.state!=='dead'&&!c.gone&&Math.hypot(c.x-F.x,c.z-F.z)<25))crime(1);
  if(ST.mags[W.id]===0)ST.reload=1.3}
/* РПГ: снаряд + взрыв по площади */
const ROCK=[],FX=[];
function launchRocket(a,dir,W){const g=new T.Group(),b=new T.Mesh(new T.CylinderGeometry(.06,.06,.5,8),GM.olive);b.rotation.x=Math.PI/2;g.add(b);const t=new T.Mesh(new T.ConeGeometry(.06,.18,8),GM.dark);t.rotation.x=Math.PI/2;t.position.z=.33;g.add(t);
  const fl=new T.Mesh(new T.SphereGeometry(.12,6,4),new T.MeshBasicMaterial({color:0xffb347,toneMapped:false}));fl.position.z=-.3;g.add(fl);g.position.copy(a);g.lookAt(a.clone().add(dir));sc.add(g);ROCK.push({g,v:dir.clone().multiplyScalar(45),t:0,W})}
function stepRockets(dt){for(let i=ROCK.length-1;i>=0;i--){const r=ROCK[i];r.t+=dt;r.g.position.addScaledVector(r.v,dt);const p=r.g.position;let boom=p.y<.15||r.t>r.W.range/45||(p.y<40&&hit(p.x,p.z,.1));
    if(!boom)for(const n of NPC)if(n.state!=='dead'&&!n.gone&&Math.hypot(n.x-p.x,n.z-p.z)<.9&&p.y<2.2){boom=true;break}
    if(boom){explode(p.clone(),r.W);sc.remove(r.g);ROCK.splice(i,1)}}}
function explode(p,W){const s=new T.Mesh(new T.SphereGeometry(1,20,14),new T.MeshBasicMaterial({color:0xff8c1a,transparent:true,opacity:.95,toneMapped:false,depthWrite:false}));s.position.copy(p);sc.add(s);
  const c=new T.Mesh(new T.SphereGeometry(1,16,10),new T.MeshBasicMaterial({color:0xfff1b0,transparent:true,opacity:1,toneMapped:false,depthWrite:false}));c.position.copy(p);sc.add(c);const l=new T.PointLight(0xffa040,6,40);l.position.copy(p).add(new T.Vector3(0,2,0));sc.add(l);
  FX.push({s,c,l,t:0,r:W.splash});sfx(120,1.1,'',.3,true);shake=.6;
  for(const n of NPC){const d=Math.hypot(n.x-p.x,n.z-p.z);if(d<W.splash&&n.state!=='dead'&&!n.gone)damageNpc(n,W.damage*(1-d/W.splash),(n.x-p.x)/(d||1),(n.z-p.z)/(d||1),true)}
  const dp=Math.hypot(px()-p.x,pz()-p.z);if(dp<W.splash)hurt(W.damage*.35*(1-dp/W.splash))}
function stepFx(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;const k=f.t/.5;f.s.scale.setScalar(.5+k*f.r);f.s.material.opacity=Math.max(0,.95-k);f.c.scale.setScalar(.3+k*f.r*.5);f.c.material.opacity=Math.max(0,1-k*1.6);f.l.intensity=Math.max(0,6*(1-k));
  if(k>=1){sc.remove(f.s,f.c,f.l);FX.splice(i,1)}}}
function hurt(d){if(ST.dead)return;const a=Math.min(ST.arm,d*.7);ST.arm-=a;ST.hp-=d-a;$('dmg').style.opacity=.9;setTimeout(()=>$('dmg').style.opacity=0,180);if(ST.hp<=0)wasted()}
function wasted(){ST.hp=0;ST.dead=1;big('ПОТРАЧЕНО','wasted');if(MS)missionEnd(false,true);setTimeout(()=>{ST.dead=0;ST.hp=100;ST.wanted=0;ST.money=Math.max(0,ST.money-500);for(const n of NPC)n.angry=0;if(ST.mode==='foot'){F.x=-2;F.z=56;F.y=0}$('big').hidden=true;toast('Больница: −500 ₽ за лечение')},2600)}
let shake=0;

  const R2=(x,y,w,h)=>{c.fillRect(x,y,w,h);c.strokeRect(x,y,w,h)};

  else if(t==='rifle'){R2(-38,-6,22,12);R2(-16,-10,30,14);R2(14,-6,24,6);R2(-4,4,9,22)}else if(t==='sniper'){R2(-40,-4,30,10);R2(-12,-8,24,12);R2(12,-4,28,5);R2(-8,-20,20,8)}else{R2(-40,-9,80,16);R2(-6,7,8,16)}c.restore()}

/* ---------- миссии ---------- */
const MK=[],MS_DEF={kill:{n:'Разборка',d:'Убей 5 бандитов',time:180,rew:3000,at:[9.5,32]},race:{n:'Курьер',d:'Доедь до точки за 2 минуты',time:120,rew:2000,at:[-9.5,-62]}};let MS=null;
function markerMesh(col,r,h){const g=new T.Group(),m=new T.Mesh(new T.CylinderGeometry(r,r,h,28,1,true),new T.MeshBasicMaterial({color:col,transparent:true,opacity:.35,side:T.DoubleSide,depthWrite:false,toneMapped:false}));m.position.y=h/2;g.add(m);
  const a=new T.Mesh(new T.ConeGeometry(.6,1.1,4),new T.MeshBasicMaterial({color:col,toneMapped:false}));a.rotation.x=Math.PI;a.position.y=h+1.4;g.add(a);g.userData.arrow=a;sc.add(g);return g}
for(const k in MS_DEF){const D=MS_DEF[k],g=markerMesh(0xffd23f,1.3,2.6);g.position.set(D.at[0],.2,D.at[1]);MK.push({k,g,x:D.at[0],z:D.at[1]})}
function startMission(k){const D=MS_DEF[k];MS={k,kind:k,t:D.time,D};MK.forEach(m=>m.g.visible=false);sfx(520,.3,'triangle',.08);
  if(k==='kill'){MS.left=5;MS.bad=[];const cx=95,cz=-(RW/2+SW+6);for(let i=0;i<5;i++){const n=NPC.find(o=>o.kind==='bandit'&&o.gone)||mkNpc('bandit');n.gone=0;n.state='walk';n.hp=60;n.hit=0;n.t=0;n.x=cx+rnd(-8,8);n.z=cz-rnd(0,6);n.m.g.visible=true;n.m.g.rotation.set(0,0,0);MS.bad.push(n)}}
  else{MS.cp={x:200,z:-3.5};MS.mark=markerMesh(0xffd23f,4.5,9);MS.mark.position.set(MS.cp.x,.2,MS.cp.z)}
  big(D.n.toUpperCase(),'pass',D.d);setTimeout(()=>{if(!ST.dead)$('big').hidden=true},1800);missionText()}
function missionText(){if(!MS)return;$('obj').hidden=false;$('obj').innerHTML=MS.kind==='kill'?`Убей <b>бандитов</b>: осталось ${MS.left} из 5`:`Доедь до <b>жёлтой точки</b> на радаре`}
function missionEnd(ok,silent){const D=MS.D;if(MS.mark)sc.remove(MS.mark);if(MS.bad)MS.bad.forEach(n=>{if(n.state!=='dead'){n.m.g.visible=false;n.gone=1;n.state='dead';n.t=0;n.m.hb.visible=false}});
  if(ok){ST.money+=D.rew;big('МИССИЯ ПРОЙДЕНА!','pass','+'+fmt(D.rew));sfx(660,.5,'triangle',.1)}else if(!silent)big('МИССИЯ ПРОВАЛЕНА','fail');
  MS=null;$('obj').hidden=true;$('mtimer').hidden=true;MK.forEach(m=>m.g.visible=true);if(!silent)setTimeout(()=>{if(!ST.dead)$('big').hidden=true},2600)}
function stepMission(dt){if(!MS)return;MS.t-=dt;const s=Math.max(0,Math.ceil(MS.t));$('mtimer').hidden=false;$('mtimer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  if(MS.kind==='kill'){if(MS.left<=0)return missionEnd(true)}else if(Math.hypot(px()-MS.cp.x,pz()-MS.cp.z)<5.5)return missionEnd(true);if(MS.t<=0)missionEnd(false)}
function big(t,cls,sub){const b=$('big');b.className='hud out '+cls;b.innerHTML=t+(sub?`<small>${sub}</small>`:'');b.hidden=false}

$('sclose').onclick=closeShop;$('shop').addEventListener('click',e=>{if(e.target.id==='shop')closeShop()});
function renderItems(){if(shop.id==='gun'){let cls='';$('items').innerHTML=WEAPONS.map(W=>{const own=ST.inv.includes(W.id),h=W.cls!==cls?`<div style="margin:12px 0 2px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em">${cls=W.cls}</div>`:'';
